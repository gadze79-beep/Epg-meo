name: Atualizar EPG MEO Automático

on:
  schedule:
    - cron: '0 3 * * *' # Executa todos os dias às 03:00 UTC
  workflow_dispatch: # Permite executar manualmente para testar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          pip install requests beautifulsoup4

      - name: Executar script EPG
        run: |
          python gerar_epg.py

      - name: Guardar e publicar alterações
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add epg_meo.xml
          git commit -m "Atualização diária do EPG" || exit 0
          git push
